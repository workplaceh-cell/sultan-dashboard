<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم مطعم السلطان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg-1:#0f0a07;--bg-2:#1a1411;--bg-3:#261f1a;--bg-4:#2a1f1a;--bg-hover:#3a2e26;
  --text-1:#f5e9d8;--text-2:#c4b4a4;--text-3:#8a7a6a;
  --border:#3a2e26;
  --accent:#d92d27;--accent-h:#b81e1a;--accent-soft:rgba(217,45,39,.15);
  --secondary:#ff8a18;--success:#228b55;--warning:#f59e0b;--danger:#dc2626;--info:#0ea5e9;
  --shadow-s:0 2px 8px rgba(0,0,0,.3);--shadow-m:0 8px 20px rgba(0,0,0,.4);--shadow-l:0 15px 35px rgba(0,0,0,.5);
  --r-s:8px;--r-m:12px;--r-l:16px;--tr:.2s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Cairo',Tahoma,sans-serif;background:var(--bg-1);color:var(--text-1);min-height:100vh;overflow-x:hidden;max-width:100%;line-height:1.5}
button,input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh}
.sidebar{
  width:260px;background:var(--bg-2);border-left:1px solid var(--border);
  padding:24px 0;position:fixed;top:0;right:0;height:100vh;overflow-y:auto;
  z-index:100;transition:transform .3s ease;display:flex;flex-direction:column;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.main-content{flex:1;margin-right:260px;padding:24px;min-height:100vh;min-width:0}

.sidebar-header{padding:0 24px 20px;border-bottom:1px solid var(--border);margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px;font-size:1.25rem;font-weight:700}
.brand-icon{
  width:44px;height:44px;
  background:linear-gradient(135deg,var(--accent),var(--secondary));
  border-radius:var(--r-m);display:grid;place-items:center;color:#fff;font-size:1.3rem;
  box-shadow:0 4px 12px var(--accent-soft);
}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-text small{font-size:.75rem;color:var(--text-3);font-weight:500}

.sidebar-nav{display:flex;flex-direction:column;gap:4px;padding:0 12px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-m);
  color:var(--text-2);cursor:pointer;transition:var(--tr);font-weight:500;font-size:.95rem;
  border:none;background:transparent;width:100%;text-align:right;
}
.nav-item:hover{background:var(--bg-hover);color:var(--text-1)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item i{width:20px;text-align:center;font-size:1.05rem}
.nav-section{padding:12px 24px;font-size:.75rem;color:var(--text-3);text-transform:uppercase;font-weight:600;margin-top:12px}

.sidebar-footer{padding:12px;border-top:1px solid var(--border)}

.topbar{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;
  padding:16px 20px;background:var(--bg-2);border-radius:var(--r-l);border:1px solid var(--border);
  gap:10px;flex-wrap:wrap;
}
.topbar-title{font-size:1.4rem;font-weight:700;display:flex;align-items:center;gap:10px;min-width:0}
.topbar-title i{color:var(--accent)}
.topbar-actions{display:flex;gap:12px;align-items:center}
.mobile-menu-btn{display:none;width:40px;height:40px;border-radius:var(--r-m);background:var(--bg-4);border:1px solid var(--border);color:var(--text-1);font-size:1.1rem;cursor:pointer}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:var(--r-m);font-weight:600;font-size:.92rem;
  cursor:pointer;transition:var(--tr);border:none;font-family:inherit;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-h)}
.btn-secondary{background:var(--bg-3);color:var(--text-1);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-hover)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

.input,.select,.textarea{
  width:100%;padding:10px 14px;background:var(--bg-3);border:1px solid var(--border);
  border-radius:var(--r-m);color:var(--text-1);font-size:.92rem;transition:var(--tr);
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:.88rem;font-weight:500;color:var(--text-2);margin-bottom:6px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:var(--bg-4);border:1px solid var(--border);border-radius:var(--r-l);
  padding:20px;transition:var(--tr);position:relative;overflow:hidden;min-width:0;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-m);border-color:var(--bg-hover)}
.stat-card-icon{
  width:48px;height:48px;border-radius:var(--r-m);display:grid;place-items:center;
  font-size:1.25rem;margin-bottom:16px;
}
.icon-blue{background:rgba(14,165,233,.15);color:var(--info)}
.icon-red{background:var(--accent-soft);color:var(--accent)}
.icon-green{background:rgba(34,139,85,.15);color:var(--success)}
.icon-orange{background:rgba(245,158,11,.15);color:var(--warning)}
.icon-purple{background:rgba(139,92,246,.15);color:#8b5cf6}

.stat-card-label{font-size:.85rem;color:var(--text-3);margin-bottom:6px;font-weight:500}
.stat-card-value{font-size:1.7rem;font-weight:800;color:var(--text-1);margin-bottom:6px;word-break:break-word}
.stat-card-trend{font-size:.8rem;color:var(--text-3)}

.panel{background:var(--bg-4);border:1px solid var(--border);border-radius:var(--r-l);margin-bottom:20px;overflow:hidden;min-width:0}
.panel-header{
  padding:16px 20px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.panel-title{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-title i{color:var(--accent)}
.panel-body{padding:20px}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.data-table{width:100%;border-collapse:collapse;min-width:600px}
.data-table th{
  background:var(--bg-3);padding:12px 16px;text-align:right;font-weight:600;
  font-size:.85rem;color:var(--text-2);border-bottom:1px solid var(--border);white-space:nowrap;
}
.data-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:.9rem;vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr.clickable{cursor:pointer;transition:var(--tr)}
.data-table tr.clickable:hover{background:var(--bg-hover)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
.badge-new{background:rgba(14,165,233,.15);color:var(--info)}
.badge-preparing{background:rgba(245,158,11,.15);color:var(--warning)}
.badge-ready{background:rgba(217,45,39,.15);color:var(--accent)}
.badge-delivered{background:rgba(34,139,85,.15);color:var(--success)}
.badge-cancelled{background:rgba(220,38,38,.15);color:var(--danger)}
.badge-success{background:rgba(34,139,85,.15);color:var(--success)}
.badge-warn{background:rgba(245,158,11,.15);color:var(--warning)}
.badge-info{background:rgba(14,165,233,.15);color:var(--info)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .input,.filters .select{width:auto;min-width:160px}
.search-box{position:relative;flex:1;min-width:200px}
.search-box input{padding-right:38px}
.search-box i{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-3)}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  display:none;place-items:center;z-index:1000;padding:20px;
}
.modal-overlay.show{display:grid;animation:fadeIn .2s ease}
.modal{
  background:var(--bg-4);border:1px solid var(--border);border-radius:var(--r-l);
  max-width:700px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-l);
}
.modal.wide{max-width:900px}
.modal-header{
  padding:18px 22px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg-4);z-index:2;
}
.modal-title{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:10px}
.modal-body{padding:22px}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.close-btn{
  width:32px;height:32px;border-radius:50%;background:var(--bg-3);
  border:none;color:var(--text-2);cursor:pointer;transition:var(--tr);display:grid;place-items:center;
}
.close-btn:hover{background:var(--bg-hover);color:var(--text-1)}

.login-screen{
  min-height:100vh;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 20%,#2a1f1a 0%,var(--bg-1) 70%);padding:20px;
}
.login-card{
  background:var(--bg-4);border:1px solid var(--border);border-radius:var(--r-l);
  padding:40px 32px;max-width:420px;width:100%;box-shadow:var(--shadow-l);text-align:center;
}
.login-logo{
  width:72px;height:72px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--accent),var(--secondary));
  border-radius:var(--r-l);display:grid;place-items:center;font-size:2rem;color:#fff;
  box-shadow:0 10px 30px var(--accent-soft);
}
.login-title{font-size:1.4rem;margin-bottom:8px}
.login-sub{color:var(--text-3);margin-bottom:28px;font-size:.9rem}
.login-error{
  background:rgba(220,38,38,.15);color:var(--danger);padding:10px;border-radius:var(--r-m);
  font-size:.88rem;margin-top:12px;display:none;align-items:center;gap:8px;justify-content:center;
}
.login-error.show{display:flex}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-state i{font-size:3rem;margin-bottom:16px;opacity:.5}
.empty-state h3{color:var(--text-2);margin-bottom:8px}

.loader{
  display:inline-block;width:18px;height:18px;border:2px solid var(--bg-3);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;
}
.page-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;gap:16px}

.toast-container{position:fixed;top:20px;left:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{
  background:var(--bg-4);border:1px solid var(--border);color:var(--text-1);
  padding:12px 18px;border-radius:var(--r-m);box-shadow:var(--shadow-m);
  display:flex;align-items:center;gap:10px;font-size:.92rem;min-width:260px;max-width:calc(100vw - 40px);
  animation:slideIn .3s ease;border-right:4px solid var(--info);pointer-events:auto;
}
.toast.success{border-right-color:var(--success)}
.toast.success i{color:var(--success)}
.toast.error{border-right-color:var(--danger)}
.toast.error i{color:var(--danger)}
.toast.warning{border-right-color:var(--warning)}
.toast.warning i{color:var(--warning)}

.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.detail-item{background:var(--bg-3);padding:12px 14px;border-radius:var(--r-m);border:1px solid var(--border);min-width:0}
.detail-label{font-size:.78rem;color:var(--text-3);margin-bottom:4px;font-weight:500}
.detail-value{font-size:1rem;font-weight:600;color:var(--text-1);word-break:break-word}

.section-title{font-size:.95rem;font-weight:700;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.section-title i{color:var(--accent)}

.timeline{position:relative;padding-right:28px}
.timeline::before{content:"";position:absolute;right:8px;top:6px;bottom:6px;width:2px;background:var(--border)}
.timeline-item{position:relative;padding:8px 0 8px 0}
.timeline-item::before{
  content:"";position:absolute;right:-24px;top:14px;width:12px;height:12px;
  border-radius:50%;background:var(--accent);border:3px solid var(--bg-4);
}
.timeline-item.success::before{background:var(--success)}
.timeline-item.muted::before{background:var(--text-3)}
.timeline-date{font-size:.78rem;color:var(--text-3);margin-bottom:2px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Tablet ===== */
@media (max-width:900px){
  .sidebar{transform:translateX(100%);box-shadow:var(--shadow-l)}
  .sidebar.open{transform:translateX(0)}
  .main-content{margin-right:0;padding:16px}
  .mobile-menu-btn{display:grid;place-items:center}
  .topbar-title{font-size:1.15rem}
}

/* ===== Mobile: الجداول تتحول لكروت ===== */
@media (max-width:640px){
  .data-table{min-width:0 !important;width:100%}
  .data-table thead{display:none}
  .data-table,.data-table tbody{display:block;width:100%}
  .data-table tr{
    display:block;background:var(--bg-3);border:1px solid var(--border);
    border-radius:12px;margin:0 0 10px;padding:8px 10px;
  }
  .data-table tr:last-child{margin-bottom:0}
  .data-table td{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:7px 4px;border-bottom:1px dashed var(--border);text-align:right;
  }
  .data-table td:last-child{border-bottom:none}
  .data-table td::before{content:attr(data-label);font-weight:600;color:var(--text-3);font-size:.78rem;flex-shrink:0}
  .data-table td[colspan]{display:block;text-align:center !important;padding:30px 10px !important}
  .data-table td[colspan]::before{content:none}
  .data-table td .select{flex:1;min-width:0}
  .data-table td .pct-wrap{flex:1}
  .table-wrap{overflow-x:visible}
}

@media (max-width:600px){
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat-card{padding:14px}
  .stat-card-value{font-size:1.3rem}
  .filters .input,.filters .select{width:100%;min-width:0}
  .filters{flex-direction:column;align-items:stretch}
  .search-box{width:100%}
  .panel-header{flex-direction:column;align-items:stretch}
  .topbar-actions .btn span{display:none}
  #lastUpdate{display:none}
}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-1)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--bg-hover)}

.text-muted{color:var(--text-3)}
.text-success{color:var(--success)}
.text-danger{color:var(--danger)}
.text-warning{color:var(--warning)}
.text-accent{color:var(--accent)}
.text-center{text-align:center}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}
.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}
.flex{display:flex}.gap-1{gap:8px}.gap-2{gap:16px}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}}
code.inline{background:var(--bg-3);padding:2px 8px;border-radius:4px;font-size:.85rem;direction:ltr;display:inline-block}
</style>
</head>
<body>

<!-- ===== Login Screen ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo"><i class="fas fa-crown"></i></div>
    <h1 class="login-title">لوحة تحكم السلطان</h1>
    <p class="login-sub">أدخل رمز الوصول للدخول إلى لوحة الإدارة</p>
    <form id="loginForm">
      <div class="form-group">
        <input type="password" class="input" id="accessKeyInput" placeholder="رمز الوصول" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> <span>دخول</span>
      </button>
    </form>
    <div class="login-error" id="loginError"><i class="fas fa-exclamation-circle"></i> <span>رمز الوصول غير صحيح</span></div>
    <p class="text-muted" style="margin-top:24px;font-size:.8rem">
      <i class="fas fa-lock"></i> الاتصال مشفّر بين المتصفح والخادم
    </p>
  </div>
</div>

<!-- ===== Main App ===== -->
<div class="app" id="mainApp" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon"><i class="fas fa-crown"></i></div>
        <div class="brand-text">
          <span>كريب السلطان</span>
          <small>لوحة الإدارة</small>
        </div>
      </div>
    </div>

    <div class="nav-section">القائمة الرئيسية</div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="dashboard"><i class="fas fa-chart-line"></i><span>الرئيسية</span></button>
      <button class="nav-item" data-view="orders"><i class="fas fa-clipboard-list"></i><span>الطلبات</span></button>
      <button class="nav-item" data-view="customers"><i class="fas fa-users"></i><span>العملاء</span></button>
      <button class="nav-item" data-view="products"><i class="fas fa-utensils"></i><span>المنتجات</span></button>
      <button class="nav-item" data-view="reports"><i class="fas fa-file-invoice-dollar"></i><span>التقارير المالية</span></button>

      <div class="nav-section">النظام</div>
      <button class="nav-item" data-view="settings"><i class="fas fa-cog"></i><span>الإعدادات</span></button>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>خروج</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">
        <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
        <h1 class="topbar-title" id="pageTitle"><i class="fas fa-chart-line"></i> <span>الرئيسية</span></h1>
      </div>
      <div class="topbar-actions">
        <span id="lastUpdate" class="text-muted" style="font-size:.82rem"></span>
        <button class="btn btn-secondary btn-sm" id="refreshBtn"><i class="fas fa-sync-alt"></i> <span>تحديث</span></button>
      </div>
    </div>
    <div id="viewsContainer"></div>
  </main>
</div>

<!-- Modals -->
<div class="modal-overlay" id="orderModal">
  <div class="modal wide">
    <div class="modal-header">
      <h3 class="modal-title"><i class="fas fa-receipt"></i> تفاصيل الطلب</h3>
      <button class="close-btn" onclick="UI.closeModal('orderModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="orderModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="customerModal">
  <div class="modal wide">
    <div class="modal-header">
      <h3 class="modal-title"><i class="fas fa-user"></i> تفاصيل العميل</h3>
      <button class="close-btn" onclick="UI.closeModal('customerModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="customerModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3 class="modal-title" id="confirmTitle"><i class="fas fa-exclamation-triangle"></i> تأكيد</h3>
      <button class="close-btn" onclick="UI.closeModal('confirmModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <p id="confirmMessage"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="UI.closeModal('confirmModal')">إلغاء</button>
      <button class="btn btn-danger" id="confirmOk">تأكيد</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ==========================================================================
   Configuration
   ========================================================================== */

/* ==========================================================================
   Utilities
   ========================================================================== */
const Utils = {
  escapeHtml(str){
    if (str === null || str === undefined) return "";
    const div = document.createElement("div");
    div.textContent = String(str);
    return div.innerHTML;
  },

  formatMoney(n){
    const num = Number(n||0);
    return num.toLocaleString("ar-EG",{maximumFractionDigits:2}) + " ج.م";
  },

  formatDate(d){
    if (!d) return "-";
    try {
      const date = new Date(d);
      return date.toLocaleString("ar-EG",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
    } catch { return String(d); }
  },

  formatDateOnly(d){
    if (!d) return "-";
    try { return new Date(d).toLocaleDateString("ar-EG",{year:"numeric",month:"short",day:"numeric"}); }
    catch { return String(d); }
  },

  formatTime(d){
    if (!d) return "";
    try { return new Date(d).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}); }
    catch { return ""; }
  },

  /* توحيد رقم الهاتف المصري (يعالج حذف الصفر الأول بواسطة جوجل شيت) */
  normalizePhone(phone){
    if (phone === null || phone === undefined) return null;
    let p = String(phone).replace(/[\s\-().]/g,"");
    if (!p) return null;
    if (p.startsWith("+20")) p = "0" + p.substring(3);
    else if (p.startsWith("0020")) p = "0" + p.substring(4);
    else if (p.startsWith("200") && p.length === 13) p = "0" + p.substring(3);
    else if (p.startsWith("20") && p.length === 12) p = "0" + p.substring(2);
    else if (p.length === 10 && p.charAt(0) === "1") p = "0" + p;
    if (/^01[0-9]{9}$/.test(p)) return p;
    return null;
  },

  whatsappLink(phone){
    const n = this.normalizePhone(phone);
    if (!n) return null;
    return "https://wa.me/2" + n.substring(1);
  },
  telLink(phone){
    const n = this.normalizePhone(phone);
    return n ? ("tel:" + n) : null;
  },

  isToday(d){
    if (!d) return false;
    const t = new Date(), dd = new Date(d);
    return t.toDateString() === dd.toDateString();
  },
  isThisWeek(d){
    if (!d) return false;
    const now = new Date(), dd = new Date(d);
    const wk = new Date(now.getTime() - 7*24*60*60*1000);
    return dd >= wk && dd <= now;
  },
  isThisMonth(d){
    if (!d) return false;
    const now = new Date(), dd = new Date(d);
    return dd.getMonth() === now.getMonth() && dd.getFullYear() === now.getFullYear();
  },
  daysBetween(a,b){
    const d1 = new Date(a), d2 = new Date(b);
    return Math.floor(Math.abs(d2-d1)/(1000*60*60*24));
  },
  isInDateRange(d, from, to){
    if (!d) return false;
    const dd = new Date(d);
    if (from && dd < new Date(from)) return false;
    if (to) {
      const toEnd = new Date(to); toEnd.setHours(23,59,59,999);
      if (dd > toEnd) return false;
    }
    return true;
  },

  statusBadge(s){
    const map = {
      "طلب جديد":    {cls:"badge-new",      label:"جديد",       icon:"star"},
      "قيد التحضير": {cls:"badge-preparing", label:"قيد التحضير", icon:"utensils"},
      "جاهز":        {cls:"badge-ready",     label:"جاهز",       icon:"check-circle"},
      "تم التسليم":  {cls:"badge-delivered", label:"تم التسليم", icon:"check-double"},
      "ملغي":        {cls:"badge-cancelled", label:"ملغي",       icon:"times-circle"}
    };
    const info = map[s] || {cls:"badge-new",label:s||"غير محدد",icon:"circle"};
    return `<span class="badge ${info.cls}"><i class="fas fa-${info.icon}"></i> ${this.escapeHtml(info.label)}</span>`;
  },

  parseProducts(text){
    if (!text) return [];
    const lines = String(text).split("\n").map(l=>l.trim()).filter(Boolean);
    const out = [];
    for (const line of lines){
      const m = line.match(/^(.+?)\s*×\s*(\d+)\s*=\s*(\d+)/);
      if (m) out.push({name:m[1].trim(), qty:parseInt(m[2]), total:parseInt(m[3])});
      else out.push({name:line, qty:1, total:0});
    }
    return out;
  },

  downloadCSV(rows, filename){
    const BOM = "\uFEFF";
    const csv = BOM + rows.map(r => r.map(c => {
      const s = c === null || c === undefined ? "" : String(c);
      return /[",\n;]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
    }).join(",")).join("\n");
    const blob = new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 100);
  }
};

/* ==========================================================================
   API
   ========================================================================== */
const API = {
  async request(action, params={}){
    const url = new URL(CONFIG.APPS_SCRIPT_URL);
    url.searchParams.set("action", action);
    if (state.accessKey) url.searchParams.set("access_key", state.accessKey);
    for (const [k,v] of Object.entries(params)) url.searchParams.set(k,v);

    const resp = await fetch(url.toString());
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    if (!data.success) throw new Error(data.error || "فشل العملية");
    return data;
  },

  async verify(key){
    try {
      const url = `${CONFIG.APPS_SCRIPT_URL}?action=verifyAccess&access_key=${encodeURIComponent(key)}`;
      const r = await fetch(url);
      const d = await r.json();
      return d.success === true;
    } catch { return false; }
  },

  async getOrders(){ return this.request("getOrders"); },
  async updateStatus(rowIndex, status){ return this.request("updateOrderStatus",{rowIndex:String(rowIndex),status}); }
};

/* ==========================================================================
   Analytics — سياسة المبيعات: المحقق = كل الطلبات غير الملغاة
   ========================================================================== */
const Analytics = {
  orderStats(){
    const orders = state.orders;
    const byStatus = {"طلب جديد":0,"قيد التحضير":0,"جاهز":0,"تم التسليم":0,"ملغي":0};
    let todaySales=0, weekSales=0, monthSales=0;
    let todayOrders=0, weekOrders=0, monthOrders=0;
    let totalValueAll = 0;
    let realizedSales = 0;
    let realizedCount = 0;
    const productCount = new Map();

    for (const o of orders){
      byStatus[o.status] = (byStatus[o.status]||0) + 1;
      const cancelled = o.status === "ملغي";
      const amt = Number(o.finalTotal)||0;
      totalValueAll += amt;

      if (!cancelled){
        realizedSales += amt;
        realizedCount++;
        if (Utils.isToday(o.orderTime)){ todaySales += amt; todayOrders++; }
        if (Utils.isThisWeek(o.orderTime)){ weekSales += amt; weekOrders++; }
        if (Utils.isThisMonth(o.orderTime)){ monthSales += amt; monthOrders++; }
      }

      const products = Utils.parseProducts(o.productsText);
      for (const p of products){
        const cur = productCount.get(p.name) || {qty:0, total:0};
        cur.qty += p.qty;
        if (!cancelled) cur.total += p.total;
        productCount.set(p.name, cur);
      }
    }

    const delivered = orders.filter(o=>o.status==="تم التسليم").length;
    const avgOrder = realizedCount>0 ? realizedSales/realizedCount : 0;

    return {
      total: orders.length, byStatus,
      todaySales, weekSales, monthSales,
      todayOrders, weekOrders, monthOrders,
      totalValueAll, realizedSales, realizedCount,
      avgOrder, productCount,
      delivered
    };
  },

  buildCustomers(){
    const map = new Map();

    for (const o of state.orders){
      const norm = Utils.normalizePhone(o.phone);
      if (!norm) continue;
      if (!map.has(norm)){
        map.set(norm, {
          phoneNorm: norm,
          phoneOrig: o.phone,
          name: o.fullName || "عميل",
          orders: []
        });
      }
      map.get(norm).orders.push(o);
      const lastO = map.get(norm).orders.reduce((a,b)=> new Date(a.orderTime)>new Date(b.orderTime)?a:b);
      if (lastO.fullName) map.get(norm).name = lastO.fullName;
    }

    for (const [key, c] of map){
      c.orders.sort((a,b)=> new Date(b.orderTime) - new Date(a.orderTime));
      c.totalOrders = c.orders.length;
      c.deliveredOrders = c.orders.filter(o=>o.status==="تم التسليم").length;
      c.cancelledOrders = c.orders.filter(o=>o.status==="ملغي").length;
      c.activeOrders = c.orders.filter(o=>o.status!=="ملغي").length;

      c.totalOrderValue = c.orders.reduce((s,o)=>s+(Number(o.finalTotal)||0),0);
      c.realizedSales = c.orders.filter(o=>o.status!=="ملغي").reduce((s,o)=>s+(Number(o.finalTotal)||0),0);
      c.avgCompleted = c.activeOrders>0 ? c.realizedSales/c.activeOrders : 0;

      c.firstOrder = c.orders[c.orders.length-1];
      c.lastOrder = c.orders[0];
      c.daysSinceLastOrder = Utils.daysBetween(c.lastOrder.orderTime, new Date());
      c.isRepeat = c.totalOrders > 1;

      const pm = new Map();
      for (const o of c.orders){
        if (o.status==="ملغي") continue;
        for (const p of Utils.parseProducts(o.productsText)){
          const cur = pm.get(p.name)||{qty:0,total:0};
          cur.qty += p.qty; cur.total += p.total;
          pm.set(p.name,cur);
        }
      }
      c.favoriteProducts = Array.from(pm.entries())
        .sort((a,b)=>b[1].qty-a[1].qty).slice(0,5)
        .map(([n,d])=>({name:n,qty:d.qty,total:d.total}));

      const addrMap = new Map();
      for (const o of c.orders){
        const a = (o.address||"").trim();
        if (!a) continue;
        if (!addrMap.has(a)) addrMap.set(a,[]);
        addrMap.get(a).push(o.orderTime);
      }
      c.addresses = Array.from(addrMap.entries()).map(([a,dates])=>{
        dates.sort((x,y)=>new Date(y)-new Date(x));
        return {address:a, count:dates.length, lastUsed:dates[0]};
      }).sort((x,y)=> new Date(y.lastUsed)-new Date(x.lastUsed));

      const payMap = {};
      for (const o of c.orders){ payMap[o.paymentMethod] = (payMap[o.paymentMethod]||0)+1; }
      c.commonPayment = Object.entries(payMap).sort((a,b)=>b[1]-a[1])[0]?.[0] || "-";
    }

    state.customers = map;
    return map;
  },

  dailySales(days=30){
    const out = [];
    const now = new Date();
    for (let i=days-1;i>=0;i--){
      const d = new Date(now); d.setDate(d.getDate()-i);
      const key = d.toISOString().split("T")[0];
      let sales=0, count=0;
      for (const o of state.orders){
        if (o.status==="ملغي") continue;
        if (!o.orderTime) continue;
        if (o.orderTime.startsWith(key)){
          sales += Number(o.finalTotal)||0;
          count++;
        }
      }
      out.push({ date:key, label:d.toLocaleDateString("ar-EG",{month:"short",day:"numeric"}), sales, count });
    }
    return out;
  }
};

/* ==========================================================================
   UI Helpers
   ========================================================================== */
const UI = {
  toast(msg, type="info"){
    const container = document.getElementById("toastContainer");
    const icons = {success:"check-circle",error:"times-circle",info:"info-circle",warning:"exclamation-triangle"};
    const el = document.createElement("div");
    el.className = `toast ${type}`;
    el.innerHTML = `<i class="fas fa-${icons[type]||'info-circle'}"></i><span>${Utils.escapeHtml(msg)}</span>`;
    container.appendChild(el);
    setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .3s";setTimeout(()=>el.remove(),300);}, 3500);
  },

  openModal(id){
    document.getElementById(id).classList.add("show");
    document.body.style.overflow = "hidden";
  },
  closeModal(id){
    document.getElementById(id).classList.remove("show");
    if (!document.querySelector(".modal-overlay.show")) document.body.style.overflow = "";
  },

  confirm(title, message){
    return new Promise(resolve => {
      document.getElementById("confirmTitle").innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${Utils.escapeHtml(title)}`;
      document.getElementById("confirmMessage").textContent = message;
      const ok = document.getElementById("confirmOk");
      const newOk = ok.cloneNode(true);
      ok.parentNode.replaceChild(newOk, ok);
      this.openModal("confirmModal");
      newOk.addEventListener("click", ()=>{ this.closeModal("confirmModal"); resolve(true); }, {once:true});
      document.querySelectorAll('#confirmModal .btn-secondary, #confirmModal .close-btn').forEach(b=>{
        b.addEventListener("click",()=>resolve(false),{once:true});
      });
    });
  },

  updateLastUpdate(){
    if (!state.lastFetch) return;
    const el = document.getElementById("lastUpdate");
    const diff = Math.floor((Date.now() - state.lastFetch.getTime())/1000);
    let text;
    if (diff < 10) text = "تم التحديث الآن";
    else if (diff < 60) text = `آخر تحديث قبل ${diff} ثانية`;
    else if (diff < 3600) text = `آخر تحديث قبل ${Math.floor(diff/60)} دقيقة`;
    else text = `آخر تحديث: ${Utils.formatTime(state.lastFetch)}`;
    el.textContent = text;
  }
};

/* ==========================================================================
   Data Loading
   ========================================================================== */
async function loadOrders(silent=true){
  try {
    if (!silent) UI.toast("جاري جلب البيانات...", "info");
    const data = await API.getOrders();
    state.orders = data.orders || [];
    state.lastFetch = new Date();
    Analytics.buildCustomers();
    UI.updateLastUpdate();
    Storage.save({accessKey: state.accessKey});
    return true;
  } catch (err) {
    console.error(err);
    UI.toast("تعذّر جلب البيانات: " + err.message, "error");
    return false;
  }
}

      </div>
    `;

  filteredOrders(){
    const f = state.filters.orders;
    return state.orders.filter(o => {
      if (f.status !== "all" && o.status !== f.status) return false;
      if (f.search){
        const q = f.search.toLowerCase();
        const normPhone = Utils.normalizePhone(o.phone) || "";
        if (!(o.orderNumber||"").toLowerCase().includes(q) &&
            !(o.fullName||"").toLowerCase().includes(q) &&
            !(o.phone||"").includes(q) &&
            !normPhone.includes(q)) return false;
      }
      if (!Utils.isInDateRange(o.orderTime, f.dateFrom, f.dateTo)) return false;
      return true;
    });
  },

  updateCustomers(){
    const wrap = document.getElementById("customersDynamic");
    if (!wrap) return;
    const f = state.filters.customers;
    const map = state.customers;
    let customers = Array.from(map.values());

    if (f.type === "new") customers = customers.filter(c=>!c.isRepeat);
    else if (f.type === "repeat") customers = customers.filter(c=>c.isRepeat);

    if (f.search){
      const q = f.search.toLowerCase();
      customers = customers.filter(c =>
        (c.name||"").toLowerCase().includes(q) ||
        (c.phoneNorm||"").includes(q) ||
        (c.phoneOrig||"").includes(q)
      );
    }

    if (f.sortBy === "orders") customers.sort((a,b)=>b.totalOrders-a.totalOrders || b.realizedSales-a.realizedSales);
    else if (f.sortBy === "sales") customers.sort((a,b)=>b.realizedSales-a.realizedSales || b.totalOrders-a.totalOrders);
    else if (f.sortBy === "recent") customers.sort((a,b)=>new Date(b.lastOrder.orderTime)-new Date(a.lastOrder.orderTime));
    else if (f.sortBy === "avg") customers.sort((a,b)=>b.avgCompleted-a.avgCompleted);

    const topByOrders = Array.from(map.values()).sort((a,b)=>b.totalOrders-a.totalOrders || b.realizedSales-a.realizedSales).slice(0,10);
    const topBySales = Array.from(map.values()).sort((a,b)=>b.realizedSales-a.realizedSales || b.totalOrders-a.totalOrders).slice(0,10);

    wrap.innerHTML = `

                      <td data-label="#"><strong>${i+1}</strong></td>
                      <td data-label="العميل">${Utils.escapeHtml(c.name)}</td>
                      <td data-label="الهاتف"><span dir="ltr" style="display:inline-block">${Utils.escapeHtml(c.phoneNorm)}</span></td>
                      <td data-label="عدد الطلبات"><strong>${c.totalOrders}</strong></td>
                      <td data-label="المبيعات">${Utils.formatMoney(c.realizedSales)}</td>
                    </tr>
                  `).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div class="panel-title"><i class="fas fa-medal"></i> الأعلى مبيعات (أعلى 10)</div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>#</th><th>العميل</th><th>الهاتف</th><th>المبيعات المحققة</th><th>عدد الطلبات</th></tr></thead>
              <tbody>
                ${topBySales.length===0 ? `<tr><td colspan="5" class="text-center text-muted" style="padding:30px">لا توجد بيانات</td></tr>` :
                  topBySales.map((c,i)=>`
                    <tr class="clickable" onclick="openCustomerModal('${c.phoneNorm}')">
                      <td data-label="#"><strong>${i+1}</strong></td>
                      <td data-label="العميل">${Utils.escapeHtml(c.name)}</td>
                      <td data-label="الهاتف"><span dir="ltr" style="display:inline-block">${Utils.escapeHtml(c.phoneNorm)}</span></td>
                      <td data-label="المبيعات المحققة"><strong>${Utils.formatMoney(c.realizedSales)}</strong></td>
                      <td data-label="عدد الطلبات">${c.totalOrders}</td>
                    </tr>
                  `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div class="panel-title"><i class="fas fa-list"></i> جميع العملاء <span class="badge badge-info">${customers.length}</span></div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>الاسم</th><th>الهاتف</th><th>الطلبات</th><th>المكتملة</th><th>الملغاة</th>
                <th>المبيعات</th><th>المتوسط</th><th>أول طلب</th><th>آخر طلب</th><th>منذ</th>

              ${customers.length===0 ? `<tr><td colspan="10" class="text-center text-muted" style="padding:40px">لا يوجد عملاء مطابقون</td></tr>` :
                customers.map(c=>`
                  <tr class="clickable" onclick="openCustomerModal('${c.phoneNorm}')">
                    <td data-label="الاسم">${Utils.escapeHtml(c.name)} ${c.isRepeat?'<span class="badge badge-success" style="margin-right:4px">متكرر</span>':'<span class="badge badge-info" style="margin-right:4px">جديد</span>'}</td>
                    <td data-label="الهاتف"><span dir="ltr" style="display:inline-block">${Utils.escapeHtml(c.phoneNorm)}</span></td>

                    <td data-label="المكتملة" class="text-success">${c.deliveredOrders}</td>
                    <td data-label="الملغاة" class="text-danger">${c.cancelledOrders}</td>
                    <td data-label="المبيعات">${Utils.formatMoney(c.realizedSales)}</td>
                    <td data-label="المتوسط">${Utils.formatMoney(c.avgCompleted)}</td>
                    <td data-label="أول طلب">${Utils.formatDateOnly(c.firstOrder.orderTime)}</td>
                    <td data-label="آخر طلب">${Utils.formatDateOnly(c.lastOrder.orderTime)}</td>
                    <td data-label="منذ">${c.daysSinceLastOrder} يوم</td>
                  </tr>
                `).join("")}
            </tbody>
          </table>
        </div>
      </div>
    `;
  },

  attachCustomersEvents(){
    const bind = (id, key) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener(el.tagName==="INPUT"?"input":"change", e=>{
        state.filters.customers[key] = e.target.value;

      });
    };
    bind("custSearch","search"); bind("custType","type"); bind("custSort","sortBy");
    Views.updateCustomers();

  exportCustomers(){
    const rows = [["الاسم","رقم الهاتف","عدد الطلبات","المكتملة","الملغاة","المبيعات المحققة","متوسط الطلب","أول طلب","آخر طلب","أيام منذ آخر طلب"]];
    for (const c of state.customers.values()){

      ]);

    Utils.downloadCSV(rows, `عملاء_السلطان_${new Date().toISOString().split("T")[0]}.csv`);

  /* ----- Reports ----- */
  renderReports(){
    const f = state.filters.reports;
    const filtered = state.orders.filter(o => Utils.isInDateRange(o.orderTime, f.dateFrom, f.dateTo));

    const totalOrders = filtered.length;
    const cancelled = filtered.filter(o=>o.status==="ملغي").length;
    const delivered = filtered.filter(o=>o.status==="تم التسليم").length;
    const activeOrders = filtered.filter(o=>o.status!=="ملغي");
    const realized = activeOrders.reduce((s,o)=>s+(Number(o.finalTotal)||0),0);
    const avgOrder = activeOrders.length>0 ? realized/activeOrders.length : 0;

    const prodMap = new Map();
    for (const o of filtered){
      if (o.status==="ملغي") continue;
      for (const p of Utils.parseProducts(o.productsText)){
        const cur = prodMap.get(p.name)||{qty:0,total:0};
        cur.qty+=p.qty; cur.total+=p.total;
        prodMap.set(p.name,cur);
      }
    }
    const topProducts = Array.from(prodMap.entries()).sort((a,b)=>b[1].qty-a[1].qty).slice(0,10);

    const custMap = new Map();
    for (const o of filtered){
      if (o.status==="ملغي") continue;

async function updateOrderStatus(rowIndex, newStatus, selectEl){
  const o = state.orders.find(x=>x.rowIndex===rowIndex);
  if (!o) return;
  if (o.status === newStatus) return;

  if (newStatus === "ملغي"){
    const ok = await UI.confirm("تأكيد الإلغاء", `هل أنت متأكد من إلغاء الطلب ${o.orderNumber}؟\nسيبقى الطلب محفوظاً في السجل كملغى ولن يُحذف.`);
    if (!ok){ if (selectEl) selectEl.value = o.status; return; }
  }

  try {
    if (selectEl) selectEl.disabled = true;
    await API.updateStatus(rowIndex, newStatus);
    const order = state.orders.find(x=>x.rowIndex===rowIndex);
    if (order) order.status = newStatus;
    Analytics.buildCustomers();
    UI.toast("تم تحديث الحالة بنجاح", "success");
    if (state.currentView === "dashboard") navigate("dashboard");
    else if (state.currentView === "orders") Views.updateOrdersTable();
    else if (state.currentView === "customers") Views.updateCustomers();
    else if (state.currentView === "reports") navigate("reports", true);
  } catch (err) {
    UI.toast("فشل التحديث: " + err.message, "error");
    if (selectEl) selectEl.value = o.status;
  } finally {
    if (selectEl) selectEl.disabled = false;
  }
}

async function updateOrderStatusFromModal(rowIndex, newStatus){
  await updateOrderStatus(rowIndex, newStatus, null);
  UI.closeModal("orderModal");
  openOrderModal(rowIndex);
}

  orders:{title:"الطلبات",icon:"clipboard-list",render:Views.renderOrders.bind(Views),attach:Views.attachOrdersEvents.bind(Views)},
  customers:{title:"العملاء",icon:"users",render:Views.renderCustomers.bind(Views),attach:Views.attachCustomersEvents.bind(Views)},
  products:{title:"المنتجات",icon:"utensils",render:Views.renderProducts.bind(Views),attach:Views.attachProductsEvents.bind(Views)},
  reports:{title:"التقارير المالية",icon:"file-invoice-dollar",render:Views.renderReports.bind(Views),attach:Views.attachReportsEvents.bind(Views)},
  settings:{title:"الإعدادات",icon:"cog",render:Views.renderSettings.bind(Views),attach:()=>{}}

function navigate(view, keepScroll=false){
  const meta = viewMeta[view];
  if (!meta) return;
  state.currentView = view;

  document.querySelectorAll(".nav-item").forEach(el=>{
    el.classList.toggle("active", el.dataset.view === view);
  });

  const titleEl = document.getElementById("pageTitle");
  titleEl.innerHTML = `<i class="fas fa-${meta.icon}"></i> <span>${meta.title}</span>`;

  const container = document.getElementById("viewsContainer");

  try {
    container.innerHTML = meta.render();
    if (meta.attach) meta.attach();
    if (meta.after) meta.after();
  } catch (err) {
    console.error(err);
    container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>خطأ في العرض</h3><p>${Utils.escapeHtml(err.message)}</p></div>`;
  }

  document.getElementById("sidebar").classList.remove("open");
}

/* ==========================================================================
   Auth
   ========================================================================== */
async function tryAutoLogin(){
  const saved = Storage.load();
  if (saved && saved.accessKey){
    state.accessKey = saved.accessKey;
    const ok = await API.verify(saved.accessKey);
    if (ok){
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("mainApp").style.display = "flex";
      await loadOrders(true);
      navigate("dashboard");
      startAutoRefresh();
      return true;
    } else {
      Storage.clear();
      state.accessKey = null;
    }
  }
  return false;
}

async function handleLogin(e){
  e.preventDefault();
  const key = document.getElementById("accessKeyInput").value.trim();
  if (!key){ return; }
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("loginError");
  err.classList.remove("show");
  btn.disabled = true;
  btn.innerHTML = '<div class="loader"></div> <span>جاري التحقق...</span>';
  try {
    const ok = await API.verify(key);
    if (ok){
      state.accessKey = key;
      Storage.save({accessKey:key});
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("mainApp").style.display = "flex";
      await loadOrders(true);
      navigate("dashboard");
      startAutoRefresh();
      UI.toast("تم الدخول بنجاح","success");
    } else {
      err.classList.add("show");
      err.querySelector("span").textContent = "رمز الوصول غير صحيح";
    }
  } catch (e2) {
    err.classList.add("show");
    err.querySelector("span").textContent = "تعذّر الاتصال بالخادم: " + e2.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>دخول</span>';
  }
}

async function logout(){
  const ok = await UI.confirm("تسجيل الخروج","هل تريد تسجيل الخروج من لوحة التحكم؟");
  if (!ok) return;
  state.accessKey = null;
  Storage.clear();
  stopAutoRefresh();
  location.reload();
}

function changeAccessKey(){
  const newKey = prompt("أدخل رمز الوصول الجديد (سيتم حفظه في هذا المتصفح فقط):");
  if (!newKey) return;
  state.accessKey = newKey.trim();
  Storage.save({accessKey: state.accessKey});
  UI.toast("تم حفظ رمز الوصول الجديد","success");
}

function clearCache(){
  state.orders = [];
  state.customers = new Map();
  navigate(state.currentView);
  UI.toast("تم مسح البيانات المحلية","success");
}

function startAutoRefresh(){
  stopAutoRefresh();
  state.autoRefreshTimer = setInterval(async ()=>{
    if (state.currentView === "settings") return;
    await loadOrders(true);
    // تحديث جزئي بدون إعادة رسم الصفحة (عشان ما يفقدش الفوكس من البحث)
    if (state.currentView === "orders") Views.updateOrdersTable();
    else if (state.currentView === "customers") Views.updateCustomers();
    else if (state.currentView === "products") Views.updateProductsTable();
    else navigate(state.currentView, true);
  }, CONFIG.AUTO_REFRESH_MS);
}
function stopAutoRefresh(){
  if (state.autoRefreshTimer){ clearInterval(state.autoRefreshTimer); state.autoRefreshTimer=null; }
}

/* ==========================================================================
   Init
   ========================================================================== */
document.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("loginForm").addEventListener("submit", handleLogin);
  document.getElementById("logoutBtn").addEventListener("click", logout);
  document.getElementById("refreshBtn").addEventListener("click", async ()=>{
    UI.toast("جاري التحديث...","info");
    await loadOrders(false);
    if (state.currentView === "orders") Views.updateOrdersTable();
    else if (state.currentView === "customers") Views.updateCustomers();
    else if (state.currentView === "products") Views.updateProductsTable();
    else navigate(state.currentView);
    UI.toast("تم التحديث","success");
  });
  document.getElementById("mobileMenuBtn").addEventListener("click", ()=>{
    document.getElementById("sidebar").classList.toggle("open");
  });
  document.querySelectorAll(".nav-item[data-view]").forEach(btn=>{
    btn.addEventListener("click", ()=> navigate(btn.dataset.view));
  });
  document.querySelectorAll(".modal-overlay").forEach(m=>{
    m.addEventListener("click", e=>{ if (e.target===m) m.classList.remove("show"); });
  });

  const loggedIn = await tryAutoLogin();
  if (!loggedIn){
    document.getElementById("accessKeyInput").focus();
  }

  setInterval(()=>UI.updateLastUpdate(), 5000);
});

document.addEventListener("keydown", e=>{
  if (e.key==="Escape"){
    document.querySelectorAll(".modal-overlay.show").forEach(m=>m.classList.remove("show"));
    document.body.style.overflow = "";
  }
});
</script>
</body>
</html>
